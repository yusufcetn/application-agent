[project]
name = "apply-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.46",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
